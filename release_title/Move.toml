[package]
name = "release_title"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# The release's preferred title: presentation, not protocol state, so core
# carries none. Self-asserted with no vocabulary to enforce — hence no
# dependency beyond musicos core, which is only needed to reach `Release`
# through its cap-gated `uid_mut`.
[dependencies]
musicos = { git = "https://github.com/misofm/musicos.git", rev = "6dff4deca5ced186989c064e152c92a06384750c" }
