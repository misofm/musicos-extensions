[package]
name = "recording_master_reference"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# A deliberate holdover: a bare Walrus reference to a recording's master, with no
# attestation and no technical claims about the audio. Depends only on musicos core
# (to reach `Recording` through its cap-gated `uid_mut`) and `ori` for the
# reference type.
[dependencies]
musicos = { git = "https://github.com/misofm/musicos.git", rev = "b3d5d4005fe36044d90e318f864dbc8b01de41da" }
ori = { git = "https://github.com/unconfirmedlabs/ori.git", subdir = "move", rev = "367ed5fe92a8b62da02c1116537cf08d111e0789" }
