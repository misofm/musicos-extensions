[package]
name = "release_genre"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# One concern, one package: the release's own genre classification and
# nothing else. It needs only the shared genre vocabulary and musicos core, to
# prove vocabulary membership and to operate on `Release` through its
# cap-gated `uid_mut`.
[dependencies]
genre = { git = "https://github.com/misofm/genre.git", rev = "268d4bc45eecdaf7b75dc443e4974b9469912513" }
musicos = { git = "https://github.com/misofm/musicos.git", rev = "7f67ecc7b95f585346a9d52546582bea28b64e96" }
