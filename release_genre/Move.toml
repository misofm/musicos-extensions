[package]
name = "release_genre"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# One concern, one package: the release's own genre classification and
# nothing else. It needs only the shared genre vocabulary and musicos core, to
# prove vocabulary membership and to operate on `Release` through its
# cap-gated `uid_mut`.
[dependencies]
genre = { git = "https://github.com/misofm/genre.git", rev = "bca41f3b906b7a1562bba1c3d619eaf81ca75f0f" }
musicos = { git = "https://github.com/misofm/musicos.git", rev = "1513a450667e6453582f3b30c03c1c14e073b285" }
