[package]
name = "release_genre"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# One concern, one package: the release's own genre classification and
# nothing else. It needs only the shared genre vocabulary and musicos core, to
# prove vocabulary membership and to operate on `Release` through its
# cap-gated `uid_mut`.
[dependencies]
genre = { git = "https://github.com/misofm/genre.git", rev = "09f6882b57b19498f36fa15840cd7ed61094dc41" }
musicos = { git = "https://github.com/misofm/musicos.git", rev = "b3d5d4005fe36044d90e318f864dbc8b01de41da" }
