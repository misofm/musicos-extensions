[package]
name = "recording_genre"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# One concern, one package: which genres classify a recording, primary first.
# `genre` supplies the canonical vocabulary — every stored id is proven by a
# `&Genre` at write time — so this package validates only order, count, and
# duplicates.
[dependencies]
genre = { git = "https://github.com/misofm/genre.git", rev = "b10a987aa998b5a6ddc6af762f277fb2a0f1e426" }
musicos = { git = "https://github.com/misofm/musicos.git", rev = "f7a2be77ecc4429a1c5ff70800490b1946b1defb" }
