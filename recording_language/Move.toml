[package]
name = "recording_language"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# One concern, one package: which languages are sung or spoken on a recording.
# `language_code` supplies an ISO 639-1 code that is valid by construction, so
# this package validates only count and duplicates — the same split
# `party_profile` uses.
[dependencies]
miso = { git = "https://github.com/misofm/protocol.git", rev = "6de5f9881ee62c81c57ce16832efc24dc33ae429" }
language_code = { git = "https://github.com/unconfirmedlabs/language_code.git", rev = "61542357f3d2ff989d120185046def7cf6c8bdcb" }
